name: Build Vocax APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.vocax \
            --project-name vocax \
            build_workspace

      - name: Copy Vocax source
        run: |
          rm -rf build_workspace/lib build_workspace/test
          cp -r lib build_workspace/
          cp -r test build_workspace/
          cp -r assets build_workspace/
          cp pubspec.yaml analysis_options.yaml build_workspace/

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "build_workspace/android/app/src/main/AndroidManifest.xml"
          )
          content = manifest.read_text()

          permissions = [
              "android.permission.RECORD_AUDIO",
              "android.permission.INTERNET",
          ]

          for permission in permissions:
              if permission not in content:
                  declaration = (
                      f'    <uses-permission android:name="{permission}" />\n'
                  )
                  content = content.replace(
                      "<application",
                      declaration + "    <application",
                      1,
                  )

          # Android 11+ needs this so speech recognition services are visible.
          if "android.speech.RecognitionService" not in content:
              queries = (
                  "    <queries>\n"
                  "        <intent>\n"
                  '            <action android:name="android.speech.RecognitionService" />\n'
                  "        </intent>\n"
                  "    </queries>\n"
              )
              content = content.replace(
                  "<application", queries + "    <application", 1
              )

          # Show "Vocax" under the app icon instead of "vocax".
          content = content.replace('android:label="vocax"', 'android:label="Vocax"')

          manifest.write_text(content)
          print("Android permissions and app name configured.")
          PY

      - name: Install dependencies
        working-directory: build_workspace
        run: flutter pub get

      - name: Generate app icons
        working-directory: build_workspace
        run: dart run flutter_launcher_icons

      - name: Format Dart code
        working-directory: build_workspace
        run: dart format lib test

      - name: Analyze Dart code
        working-directory: build_workspace
        run: flutter analyze lib test --no-fatal-infos

      - name: Run tests
        working-directory: build_workspace
        run: flutter test

      - name: Build release APK
        working-directory: build_workspace
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vocax-android-apk
          path: build_workspace/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
